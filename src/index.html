<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiChelitos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/libro-contexto.css">
</head>
<body class="tauri-app">
    <a class="skip-link" href="#app-content">Saltar al contenido principal</a>
    <div class="glass-bg"></div>
    
    <div class="app-layout">
        <header class="app-sidebar" aria-label="Cabecera de la aplicación">
            <div class="sidebar-header">
                <img src="assets/logo.jpg" alt="" class="sidebar-logo">
                <span class="logo-text">MiChelitos</span>
            </div>
            
            <nav class="sidebar-nav" aria-label="Secciones" tabindex="0">
                <button data-accion="navegar" data-args='["dashboard"]' id="nav-btn-dashboard" class="nav-item active" aria-label="Inicio" aria-current="page">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Inicio</span>
                </button>
                <button data-accion="navegar" data-args='["ingresos"]' id="nav-btn-ingresos" class="nav-item" aria-label="Ingresos">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">Ingresos</span>
                </button>
                <button data-accion="navegar" data-args='["gastos"]' id="nav-btn-gastos" class="nav-item" aria-label="Gastos">
                    <span class="nav-icon">📉</span>
                    <span class="nav-label">Gastos</span>
                </button>
                <button data-accion="navegar" data-args='["tarjetas"]' id="nav-btn-tarjetas" class="nav-item" aria-label="Tarjetas">
                    <span class="nav-icon">💳</span>
                    <span class="nav-label">Tarjetas</span>
                </button>
                <button data-accion="navegar" data-args='["cuentas"]' id="nav-btn-cuentas" class="nav-item" aria-label="Cuentas">
                    <span class="nav-icon">🏦</span>
                    <span class="nav-label">Cuentas</span>
                </button>
                <button data-accion="navegar" data-args='["efectivo"]' id="nav-btn-efectivo" class="nav-item" aria-label="Efectivo">
                    <span class="nav-icon">💵</span>
                    <span class="nav-label">Efectivo</span>
                </button>
                <button data-accion="navegar" data-args='["suscripciones"]' id="nav-btn-suscripciones" class="nav-item" aria-label="Suscripciones">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-label">Suscripciones</span>
                </button>
                <button data-accion="navegar" data-args='["capital"]' id="nav-btn-capital" class="nav-item" aria-label="Capital">
                    <span class="nav-icon">🏢</span>
                    <span class="nav-label">Capital</span>
                </button>
                <button data-accion="navegar" data-args='["prestamos"]' id="nav-btn-prestamos" class="nav-item" aria-label="Deudas">
                    <span class="nav-icon">🏷️</span>
                    <span class="nav-label">Deudas</span>
                </button>
                <button data-accion="navegar" data-args='["resumen"]' id="nav-btn-resumen" class="nav-item" aria-label="Resumen">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Resumen</span>
                </button>
                <button data-accion="navegar" data-args='["evolucion"]' id="nav-btn-evolucion" class="nav-item" aria-label="Evolución">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">Evolución</span>
                </button>
                <button data-accion="navegar" data-args='["ajustes"]' id="nav-btn-ajustes" class="nav-item" aria-label="Ajustes">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Ajustes</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button id="theme-toggle-btn" class="theme-toggle" title="Cambiar tema">
                    🌙
                </button>
            </div>
        </header>

        <!-- Área de Contenido Principal -->
        <main class="app-main">
            <div id="notification-container" class="notification-container"></div>
            <div id="app-content" class="main-container" tabindex="-1">
                <!-- Se inyectan las pantallas dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui/dom.js"></script>
    <script type="module" src="js/composicion.js"></script>
</body>
</html>
