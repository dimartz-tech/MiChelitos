<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiChelitos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tauri-app">
    <div class="glass-bg"></div>
    
    <div class="app-layout">
        <!-- Sidebar lateral fijo (Diseño macOS de Escritorio) -->
        <aside class="app-sidebar">
            <div class="sidebar-header" style="justify-content: center; flex-direction: column; align-items: center; margin-bottom: 1.5rem; gap: 0.6rem;">
                <img src="assets/logo.jpg" alt="Logo MiChelitos" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent-primary); box-shadow: var(--shadow-glow); object-fit: cover;">
                <span class="logo-text" style="font-size: 1.25rem;">MiChelitos</span>
            </div>
            
            <nav class="sidebar-nav">
                <button onclick="navigate('dashboard')" id="nav-btn-dashboard" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </button>
                <button onclick="navigate('ingresos')" id="nav-btn-ingresos" class="nav-item">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">Ingresos</span>
                </button>
                <button onclick="navigate('gastos')" id="nav-btn-gastos" class="nav-item">
                    <span class="nav-icon">📉</span>
                    <span class="nav-label">Gastos</span>
                </button>
                <button onclick="navigate('tarjetas')" id="nav-btn-tarjetas" class="nav-item">
                    <span class="nav-icon">💳</span>
                    <span class="nav-label">Tarjetas</span>
                </button>
                <button onclick="navigate('cuentas')" id="nav-btn-cuentas" class="nav-item">
                    <span class="nav-icon">🏦</span>
                    <span class="nav-label">Cuentas</span>
                </button>
                <button onclick="navigate('efectivo')" id="nav-btn-efectivo" class="nav-item">
                    <span class="nav-icon">💵</span>
                    <span class="nav-label">Efectivo</span>
                </button>
                <button onclick="navigate('suscripciones')" id="nav-btn-suscripciones" class="nav-item">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-label">Suscripciones</span>
                </button>
                <button onclick="navigate('capital')" id="nav-btn-capital" class="nav-item">
                    <span class="nav-icon">🏢</span>
                    <span class="nav-label">Capital</span>
                </button>
                <button onclick="navigate('prestamos')" id="nav-btn-prestamos" class="nav-item">
                    <span class="nav-icon">🏷️</span>
                    <span class="nav-label">Deudas</span>
                </button>
                <button onclick="navigate('resumen')" id="nav-btn-resumen" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Resumen</span>
                </button>
                <button onclick="navigate('ajustes')" id="nav-btn-ajustes" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Ajustes</span>
                </button>
            </nav>

            <div class="sidebar-footer" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <button id="theme-toggle-btn" class="theme-toggle" title="Cambiar tema">
                    🌙
                </button>
                <button id="sidebar-collapse-btn" class="sidebar-toggle" title="Colapsar menú" style="background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-normal); transition: transform 0.2s ease;">
                    ◀️
                </button>
            </div>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="app-main">
            <div id="notification-container" class="notification-container"></div>
            <div id="app-content" class="main-container">
                <!-- Se inyectan las pantallas dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
