[package]
name = "michelitos-tauri"
version = "1.3.5"
description = "Aplicación de escritorio nativa macOS de gestión financiera personal y corporativa MiChelitos"
authors = ["dimartz-tech"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Reduce el tamaño del binario
codegen-units = 1
lto = true
opt-level = "z" # Optimiza por tamaño de binario
strip = true
